<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR Business Card</title>

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- AR.js -->
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

<!-- 画像を事前読み込み -->
<a-assets>
  <img id="card" src="card.png">   <!-- 名刺 -->
  <img id="icon" src="icon.png">    <!-- 飛び出す画像（追加） -->
</a-assets>

<!-- マーカー -->
<a-marker preset="hiro">

  <!-- 名刺（土台） -->
  <a-plane
    src="#card"
    width="1.5"
    height="1"
    rotation="-90 0 0"
    position="0 0.01 0"
    >
  </a-plane>

  <!-- 飛び出す画像 -->
 <a-image
  src="#icon"
  width="0.7"
  height="0.7"
  position="0.4 -0.15 0"
  rotation="0 0 0"  <!-- 少し手前に倒す -->
  animation="property: position; dir: alternate; dur: 1000; loop: true; to: 0.4 0.3 0">
 </a-image>

<!-- カメラ -->
<a-entity camera></a-entity>

</a-scene
